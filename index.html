<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRYPTO TYCOON // AAA EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #07090e;
            --surface: #0f131d;
            --surface-card: #151a26;
            --border: rgba(255, 255, 255, 0.08);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.25);
            --green: #10b981;
            --blue: #3b82f6;
            --red: #ef4444;
            --text: #f3f4f6;
            --muted: #8b949e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            overflow-x: hidden;
        }
        .app {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0d121d 0%, #07090e 100%);
        }

        /* Топ-бар телеметрии */
        .header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            padding: 10px 12px;
            background: rgba(15, 19, 29, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .h-box {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 8px;
        }
        .h-label { font-size: 9px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
        .h-val { font-size: 13px; font-weight: 800; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Вьюпорт корпуса рига */
        .rig-viewport {
            position: relative;
            width: 100%;
            height: 240px;
            background: #0b0f17 center/cover no-repeat;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
        }
        .rig-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7,9,14,0.4) 0%, rgba(7,9,14,0.1) 40%, rgba(7,9,14,0.92) 100%);
            pointer-events: none;
        }

        /* Динамическая сетка установленных карт в корпусе */
        .rig-slots {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 135px;
            display: grid;
            gap: 5px;
            pointer-events: none;
        }
        .slot-item {
            background: #111622;
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.8);
            animation: fadeIn 0.2s ease;
        }
        .slot-item img { width: 100%; height: 100%; object-fit: cover; }
        .slot-led {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 4px;
            height: 4px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--green);
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        /* Низ вьюпорта (датчики и кнопка охлаждения) */
        .rig-hud {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
        }
        .sensors { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .sensor-row { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; text-shadow: 0 1px 3px #000; }
        .s-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.15); border-radius: 99px; overflow: hidden; }
        .s-fill { height: 100%; transition: width 0.3s, background 0.3s; }
        .cool-action {
            background: rgba(59, 130, 246, 0.25);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(96, 165, 250, 0.5);
            color: #93c5fd;
            font-size: 11px;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
        }
        .cool-action:active { background: var(--blue); color: #fff; }

        /* Навигация по вкладкам */
        .nav-tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-b {
            flex: 1;
            min-width: 72px;
            padding: 11px 2px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-b.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: var(--gold-glow);
        }

        /* Контент каталогов */
        .content-area { flex: 1; padding: 12px; padding-bottom: 35px; }
        .tab-pane { display: none; flex-direction: column; gap: 8px; }
        .tab-pane.active { display: flex; }

        .shop-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }
        .shop-thumb {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: #111520;
            border: 1px solid var(--border);
            object-fit: cover;
            flex-shrink: 0;
        }
        .shop-info { flex: 1; min-width: 0; }
        .shop-title-row { display: flex; align-items: center; gap: 6px; }
        .shop-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .counter-badge { font-size: 10px; font-weight: 800; background: #21293a; color: var(--gold); padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(245,158,11,0.3); }
        .shop-specs { font-size: 11px; color: var(--muted); margin-top: 3px; }
        .shop-warn { font-size: 10px; color: var(--red); font-weight: 700; margin-top: 2px; }
        
        .buy-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #090a0d;
            border: none;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 800;
            min-width: 82px;
            cursor: pointer;
            text-align: center;
        }
        .buy-btn.usd { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; }
        .buy-btn:disabled { background: #1c2331; color: #485367; cursor: not-allowed; }

        /* Всплывающие цифры клика */
        .click-pop {
            position: absolute;
            font-weight: 900;
            font-size: 16px;
            color: #fbbf24;
            text-shadow: 0 2px 6px #000;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="h-box">
            <div class="h-label">Монеты (MGC)</div>
            <div class="h-val" id="mgcVal" style="color:var(--gold)">0.00</div>
        </div>
        <div class="h-box">
            <div class="h-label">Доллары ($)</div>
            <div class="h-val" id="usdVal" style="color:var(--green)">$0.00</div>
        </div>
        <div class="h-box">
            <div class="h-label">Хешрейт</div>
            <div class="h-val" id="hashVal" style="color:var(--blue)">0 MH/s</div>
        </div>
    </div>

    <!-- Вьюпорт с корпусом рига -->
    <div class="rig-viewport" id="rigViewport">
        <div class="rig-slots" id="rigSlotsContainer"></div>
        <div class="rig-overlay"></div>
        <div class="rig-hud">
            <div class="sensors">
                <div class="sensor-row">
                    <span style="width:50px">Питание:</span>
                    <div class="s-bar"><div class="s-fill" id="wFill" style="width:0%;background:var(--green)"></div></div>
                    <span id="wText">0/600W</span>
                </div>
                <div class="sensor-row">
                    <span style="width:50px">Нагрев:</span>
                    <div class="s-bar"><div class="s-fill" id="tFill" style="width:35%;background:var(--blue)"></div></div>
                    <span id="tText">35°C</span>
                </div>
            </div>
            <button class="cool-action" id="coolBtn">Продуть кулеры</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-b active" data-tab="gpus">Карты</button>
        <button class="tab-b" data-tab="rigs">Корпуса</button>
        <button class="tab-b" data-tab="oc">Разгон</button>
        <button class="tab-b" data-tab="infra">Питание</button>
        <button class="tab-b" data-tab="market">Биржа</button>
    </div>

    <div class="content-area">
        <div class="tab-pane active" id="pane-gpus"></div>
        <div class="tab-pane" id="pane-rigs"></div>
        <div class="tab-pane" id="pane-oc"></div>
        <div class="tab-pane" id="pane-infra"></div>
        <div class="tab-pane" id="pane-market">
            <div style="background:var(--surface-card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;">
                <div class="h-label">Текущий курс MGC / USD</div>
                <div style="font-size:24px;font-weight:800;color:var(--green);margin:6px 0" id="rateBox">$0.50</div>
                <p style="font-size:11px;color:var(--muted);margin-bottom:14px">Продавайте накопленную криптовалюту на пике курса, чтобы покупать элитное железо за доллары ($).</p>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <button class="buy-btn usd" onclick="sellCrypto(0.5)">Продать 50%</button>
                    <button class="buy-btn usd" onclick="sellCrypto(1)">Продать ВСЁ</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

// 18 уникальных видеокарт со своими персональными картинками gpu01.jpg - gpu18.jpg
const GPU_CATALOG = [
    { id: 'g1', name: 'GTX 750 Ti 2GB', img: 'gpu01.jpg', curr: 'mgc', cost: 20, pps: 0.35, watts: 55, heat: 0.2 },
    { id: 'g2', name: 'GTX 1050 Ti 4GB', img: 'gpu02.jpg', curr: 'mgc', cost: 120, pps: 1.6, watts: 75, heat: 0.35 },
    { id: 'g3', name: 'RX 470 4GB Mining', img: 'gpu03.jpg', curr: 'mgc', cost: 590, pps: 6.8, watts: 125, heat: 0.65 },
    { id: 'g4', name: 'GTX 1060 6GB Dual', img: 'gpu04.jpg', curr: 'mgc', cost: 2800, pps: 26, watts: 120, heat: 0.75 },
    { id: 'g5', name: 'RX 580 8GB Nitro+', img: 'gpu05.jpg', curr: 'mgc', cost: 13000, pps: 105, watts: 185, heat: 1.0 },
    { id: 'g6', name: 'GTX 1080 Ti 11GB', img: 'gpu06.jpg', curr: 'usd', cost: 1100, pps: 390, watts: 250, heat: 1.4 },
    { id: 'g7', name: 'RTX 2070 Super', img: 'gpu07.jpg', curr: 'usd', cost: 5200, pps: 1550, watts: 215, heat: 1.5 },
    { id: 'g8', name: 'RTX 3060 Ti LHR', img: 'gpu08.jpg', curr: 'usd', cost: 22000, pps: 5900, watts: 200, heat: 1.7 },
    { id: 'g9', name: 'RX 6800 XT Red Devil', img: 'gpu09.jpg', curr: 'usd', cost: 88000, pps: 20000, watts: 300, heat: 2.1 },
    { id: 'g10', name: 'RTX 3080 Ti Suprim', img: 'gpu10.jpg', curr: 'usd', cost: 350000, pps: 71000, watts: 350, heat: 2.6 },
    { id: 'g11', name: 'RTX 3090 24GB NVLink', img: 'gpu11.jpg', curr: 'usd', cost: 1300000, pps: 240000, watts: 380, heat: 3.1 },
    { id: 'g12', name: 'RTX 4080 Super Noctua', img: 'gpu12.jpg', curr: 'usd', cost: 5000000, pps: 840000, watts: 320, heat: 2.9 },
    { id: 'g13', name: 'RTX 4090 Liquid Matrix', img: 'gpu13.jpg', curr: 'usd', cost: 19000000, pps: 3000000, watts: 450, heat: 3.7 },
    { id: 'g14', name: 'NVIDIA A100 80GB', img: 'gpu14.jpg', curr: 'usd', cost: 78000000, pps: 11000000, watts: 400, heat: 4.0 },
    { id: 'g15', name: 'Antminer L7 Scrypt', img: 'gpu15.jpg', curr: 'usd', cost: 310000000, pps: 40000000, watts: 3400, heat: 6.2 },
    { id: 'g16', name: 'WhatsMiner M50S++', img: 'gpu16.jpg', curr: 'usd', cost: 1200000000, pps: 148000000, watts: 3600, heat: 7.0 },
    { id: 'g17', name: 'Antminer S21 Hydro', img: 'gpu17.jpg', curr: 'usd', cost: 5000000000, pps: 560000000, watts: 5200, heat: 8.2 },
    { id: 'g18', name: 'NVIDIA H200 AI Cluster', img: 'gpu18.jpg', curr: 'usd', cost: 23000000000, pps: 2300000000, watts: 8500, heat: 11.5 }
];

// Каталог корпусов (ригов)
const RIGS_CATALOG = [
    { id: 'r1', name: 'Домашний каркас (6 слотов)', img: 'rig1.jpg', slots: 6, cost: 0 },
    { id: 'r2', name: 'Алюминиевый риг открытый (12 слотов)', img: 'rig2.jpg', slots: 12, cost: 4500, curr: 'mgc' },
    { id: 'r3', name: 'Двухъярусная стойка Pro (24 слота)', img: 'rig2.jpg', slots: 24, cost: 32000, curr: 'usd' },
    { id: 'r4', name: 'Промышленный серверный шкаф (36 слотов)', img: 'rig3.jpg', slots: 36, cost: 250000, curr: 'usd' },
    { id: 'r5', name: 'Майнинг-контейнер ISO 40ft (60 слотов)', img: 'rig3.jpg', slots: 60, cost: 2100000, curr: 'usd' }
];

const OC_CATALOG = [
    { id: 'o1', name: 'Термопаста MX-4', desc: '+0.5 к силе клика', cost: 25, ppc: 0.5, curr: 'mgc' },
    { id: 'o2', name: 'Модификация таймингов BIOS', desc: '+2.5 к силе клика', cost: 180, ppc: 2.5, curr: 'mgc' },
    { id: 'o3', name: 'Андервольтинг ядер', desc: '+12 к силе клика', cost: 1200, ppc: 12, curr: 'mgc' },
    { id: 'o4', name: 'Жидкий металл Thermal Grizzly', desc: '+55 к силе клика', cost: 750, ppc: 55, curr: 'usd' },
    { id: 'o5', name: 'Кастомное ядро HiveOS PRO', desc: '+300 к силе клика', cost: 4200, ppc: 300, curr: 'usd' }
];

const INFRA_CATALOG = [
    { id: 'i1', name: 'Блок питания 750W Bronze', desc: '+750W к лимиту мощности', val: 750, cost: 80, curr: 'mgc', type: 'watt' },
    { id: 'i2', name: 'Серверный БП 1600W Platinum', desc: '+1600W к лимиту мощности', val: 1600, cost: 320, curr: 'usd', type: 'watt' },
    { id: 'i3', name: 'Кулеры Delta 4000 RPM', desc: 'Отвод тепла +3 ед/с', val: 3, cost: 150, curr: 'mgc', type: 'cool' },
    { id: 'i4', name: 'Иммерсионная ванна', desc: 'Отвод тепла +20 ед/с', val: 20, cost: 12000, curr: 'usd', type: 'cool' }
];

let state = JSON.parse(localStorage.getItem('cryptoTycoonAAA')) || {
    mgc: 0,
    usd: 0,
    clickPower: 1,
    maxWatts: 600,
    cooling: 1.5,
    temp: 35,
    activeRig: 'r1',
    ownedRigs: { r1: 1 },
    owned: {},
    rate: 0.50
};

function save() { localStorage.setItem('cryptoTycoonAAA', JSON.stringify(state)); }

function fmt(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
    return n.toFixed(2);
}

function getPrice(item) {
    const cnt = state.owned[item.id] || 0;
    return Math.floor(item.cost * Math.pow(1.22, cnt));
}

function getTotalSlots() {
    const active = RIGS_CATALOG.find(r => r.id === state.activeRig);
    return active ? active.slots : 6;
}

function getTotalCardsCount() {
    return GPU_CATALOG.reduce((sum, g) => sum + (state.owned[g.id] || 0), 0);
}

function getUsedWatts() {
    return GPU_CATALOG.reduce((s, g) => s + g.watts * (state.owned[g.id] || 0), 0);
}

function getRawPPS() {
    return GPU_CATALOG.reduce((s, g) => s + g.pps * (state.owned[g.id] || 0), 0);
}

function getActualPPS() {
    const raw = getRawPPS();
    return state.temp >= 90 ? raw * 0.5 : raw;
}

// Навигация
document.querySelectorAll('.tab-b').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('.tab-b').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('pane-' + b.dataset.tab).classList.add('active');
    });
});

// Клик по ригу
const viewport = document.getElementById('rigViewport');
viewport.addEventListener('click', (e) => {
    state.mgc += state.clickPower;
    state.temp = Math.min(105, state.temp + 0.25);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    const rect = viewport.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'click-pop';
    pop.textContent = '+' + fmt(state.clickPower);
    pop.style.left = (e.clientX - rect.left - 15) + 'px';
    pop.style.top = (e.clientY - rect.top - 10) + 'px';
    viewport.appendChild(pop);
    setTimeout(() => pop.remove(), 600);

    updateUI();
});

document.getElementById('coolBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.temp = Math.max(32, state.temp - 15);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    updateUI();
});

window.buyItem = function(type, id) {
    if (type === 'rig') {
        const rig = RIGS_CATALOG.find(r => r.id === id);
        if (state.ownedRigs[id]) {
            state.activeRig = id;
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            save();
            renderAll();
            updateUI();
            return;
        }
        if (rig.curr === 'mgc' && state.mgc >= rig.cost) {
            state.mgc -= rig.cost;
            state.ownedRigs[id] = 1;
            state.activeRig = id;
        } else if (rig.curr === 'usd' && state.usd >= rig.cost) {
            state.usd -= rig.cost;
            state.ownedRigs[id] = 1;
            state.activeRig = id;
        } else return;
    } else {
        const list = type === 'gpu' ? GPU_CATALOG : (type === 'oc' ? OC_CATALOG : INFRA_CATALOG);
        const item = list.find(x => x.id === id);
        const price = getPrice(item);

        if (item.curr === 'mgc' && state.mgc < price) return;
        if (item.curr === 'usd' && state.usd < price) return;

        if (type === 'gpu') {
            if (getTotalCardsCount() >= getTotalSlots()) {
                alert('Не хватает слотов в корпусе! Купите новый корпус во вкладке «Корпуса».');
                return;
            }
            if (getUsedWatts() + item.watts > state.maxWatts) {
                alert('Не хватает мощности БП! Улучшите питание во вкладке «Питание».');
                return;
            }
        }

        if (item.curr === 'mgc') state.mgc -= price;
        else state.usd -= price;

        state.owned[id] = (state.owned[id] || 0) + 1;

        if (type === 'oc') state.clickPower += item.ppc;
        if (type === 'infra') {
            if (item.type === 'watt') state.maxWatts += item.val;
            if (item.type === 'cool') state.cooling += item.val;
        }
    }

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save();
    renderAll();
    updateUI();
};

window.sellCrypto = function(ratio) {
    const amount = state.mgc * ratio;
    if (amount <= 0.01) return;
    state.mgc -= amount;
    state.usd += amount * state.rate;
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save();
    updateUI();
};

function renderRigSlots() {
    const container = document.getElementById('rigSlotsContainer');
    const activeRig = RIGS_CATALOG.find(r => r.id === state.activeRig);
    const slotsNum = activeRig ? activeRig.slots : 6;

    // Установка колонок в зависимости от вместимости корпуса
    const cols = slotsNum <= 6 ? 3 : (slotsNum <= 12 ? 4 : 6);
    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    let cards = [];
    [...GPU_CATALOG].reverse().forEach(g => {
        const cnt = state.owned[g.id] || 0;
        for (let i = 0; i < cnt; i++) cards.push(g);
    });

    let html = '';
    for (let i = 0; i < slotsNum; i++) {
        if (cards[i]) {
            html += `<div class="slot-item"><img src="${cards[i].img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect width=%2240%22 height=%2240%22 fill=%22%231a2233%22/></svg>'"><div class="slot-led"></div></div>`;
        } else {
            html += `<div class="slot-item" style="border:1px dashed rgba(255,255,255,0.08);background:rgba(0,0,0,0.2)"></div>`;
        }
    }
    container.innerHTML = html;
}

function renderAll() {
    renderRigSlots();

    // Видеокарты
    document.getElementById('pane-gpus').innerHTML = GPU_CATALOG.map(g => {
        const cnt = state.owned[g.id] || 0;
        const p = getPrice(g);
        const canAfford = g.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        const noSlots = getTotalCardsCount() >= getTotalSlots();
        const noWatt = getUsedWatts() + g.watts > state.maxWatts;
        return `<div class="shop-card">
            <img class="shop-thumb" src="${g.img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><rect width=%2256%22 height=%2256%22 fill=%22%23161c29%22/></svg>'">
            <div class="shop-info">
                <div class="shop-title-row">
                    <div class="shop-name">${g.name}</div>
                    <span class="counter-badge">x${cnt}</span>
                </div>
                <div class="shop-specs">+${fmt(g.pps)} MGC/с • ${g.watts}W</div>
                ${noSlots ? '<div class="shop-warn">Нет слотов в корпусе!</div>' : (noWatt ? '<div class="shop-warn">Не хватает мощности БП!</div>' : '')}
            </div>
            <button class="buy-btn ${g.curr === 'usd' ? 'usd' : ''}" ${!canAfford || noSlots || noWatt ? 'disabled' : ''} onclick="buyItem('gpu','${g.id}')">
                ${g.curr === 'usd' ? '$' : ''}${fmt(p)} ${g.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    // Корпуса
    document.getElementById('pane-rigs').innerHTML = RIGS_CATALOG.map(r => {
        const owned = !!state.ownedRigs[r.id];
        const active = state.activeRig === r.id;
        return `<div class="shop-card">
            <img class="shop-thumb" src="${r.img}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><rect width=%2256%22 height=%2256%22 fill=%22%23161c29%22/></svg>'">
            <div class="shop-info">
                <div class="shop-title-row">
                    <div class="shop-name">${r.name}</div>
                </div>
                <div class="shop-specs">Вместимость: ${r.slots} слотов для карт</div>
            </div>
            <button class="buy-btn ${r.curr === 'usd' ? 'usd' : ''}" ${active ? 'disabled' : ''} onclick="buyItem('rig','${r.id}')">
                ${active ? 'Активен' : (owned ? 'Выбрать' : (r.curr === 'usd' ? '$' : '') + fmt(r.cost) + (r.curr === 'mgc' ? ' MGC' : ''))}
            </button>
        </div>`;
    }).join('');

    // Разгон
    document.getElementById('pane-oc').innerHTML = OC_CATALOG.map(o => {
        const cnt = state.owned[o.id] || 0;
        const p = getPrice(o);
        const can = o.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="shop-card">
            <div class="shop-info">
                <div class="shop-title-row">
                    <div class="shop-name">${o.name}</div>
                    <span class="counter-badge">Ур.${cnt}</span>
                </div>
                <div class="shop-specs">${o.desc}</div>
            </div>
            <button class="buy-btn ${o.curr === 'usd' ? 'usd' : ''}" ${!can ? 'disabled' : ''} onclick="buyItem('oc','${o.id}')">
                ${o.curr === 'usd' ? '$' : ''}${fmt(p)} ${o.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    // Инфраструктура
    document.getElementById('pane-infra').innerHTML = INFRA_CATALOG.map(i => {
        const cnt = state.owned[i.id] || 0;
        const p = getPrice(i);
        const can = i.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="shop-card">
            <div class="shop-info">
                <div class="shop-title-row">
                    <div class="shop-name">${i.name}</div>
                    <span class="counter-badge">x${cnt}</span>
                </div>
                <div class="shop-specs">${i.desc}</div>
            </div>
            <button class="buy-btn ${i.curr === 'usd' ? 'usd' : ''}" ${!can ? 'disabled' : ''} onclick="buyItem('infra','${i.id}')">
                ${i.curr === 'usd' ? '$' : ''}${fmt(p)} ${i.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');
}

function updateUI() {
    const pps = getActualPPS();
    const usedW = getUsedWatts();
    const wPct = Math.min(100, (usedW / state.maxWatts) * 100);

    document.getElementById('mgcVal').textContent = fmt(state.mgc);
    document.getElementById('usdVal').textContent = '$' + fmt(state.usd);
    document.getElementById('hashVal').textContent = fmt(pps * 13.5) + ' MH/s';
    document.getElementById('rateBox').textContent = '$' + state.rate.toFixed(3);

    document.getElementById('wText').textContent = `${fmt(usedW)}/${fmt(state.maxWatts)}W`;
    const wFill = document.getElementById('wFill');
    wFill.style.width = wPct + '%';
    wFill.style.background = wPct > 85 ? '#ef4444' : '#10b981';

    document.getElementById('tText').textContent = Math.round(state.temp) + '°C';
    const tFill = document.getElementById('tFill');
    tFill.style.width = Math.min(100, state.temp) + '%';
    tFill.style.background = state.temp >= 90 ? '#ef4444' : (state.temp >= 70 ? '#f59e0b' : '#3b82f6');
}

// Игровой тик (пассивный доход и нагрев)
setInterval(() => {
    const pps = getActualPPS();
    const heatSum = GPU_CATALOG.reduce((s, g) => s + g.heat * (state.owned[g.id] || 0), 0);
    if (pps > 0) {
        state.mgc += pps;
        state.temp = Math.min(105, Math.max(32, state.temp + heatSum * 0.2 - state.cooling * 0.3));
    } else {
        state.temp = Math.max(32, state.temp - 0.5);
    }

    // Колебания курса биржи
    state.rate = Math.max(0.2, Math.min(2.0, state.rate + (Math.random() - 0.49) * 0.03));

    save();
    updateUI();
    renderAll();
}, 1000);

renderAll();
updateUI();
</script>
</body>
</html>
