<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-deep: #05070b;
            --bg-panel: #0b0f19;
            --bg-card: #111827;
            --border: rgba(255, 255, 255, 0.08);
            --gold: #f59e0b;
            --green: #10b981;
            --blue: #3b82f6;
            --red: #ef4444;
            --text: #f8fafc;
            --muted: #64748b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }
        .app {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0d1322 0%, var(--bg-deep) 100%);
        }

        /* Верхняя телеметрия */
        .header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            padding: 10px 12px;
            background: rgba(11, 15, 25, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .h-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 9px;
        }
        .h-lbl { font-size: 9px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.6px; }
        .h-val { font-size: 13px; font-weight: 900; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Вьюпорт реального корпуса с установленными видеокартами */
        .rig-viewport {
            position: relative;
            width: 100%;
            height: 255px;
            background: #080b12;
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
            overflow: hidden;
            cursor: pointer;
        }
        /* Фоновое фото корпуса rig.jpg + индустриальная подложка */
        .rig-bg-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.42;
            filter: contrast(1.15);
            pointer-events: none;
        }
        .rig-chassis {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            height: 175px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.78) 0%, rgba(9, 13, 22, 0.92) 100%);
            border: 2px solid #334155;
            border-radius: 10px;
            box-shadow: inset 0 0 25px #000, 0 8px 25px rgba(0,0,0,0.7);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .chassis-rail {
            height: 4px;
            background: linear-gradient(90deg, #475569, #94a3b8, #475569);
            border-radius: 2px;
            opacity: 0.6;
        }
        /* Сетка PCIe-слотов внутри корпуса */
        .pcie-slots-grid {
            flex: 1;
            display: grid;
            gap: 6px;
            padding: 6px 2px;
            align-items: stretch;
        }
        .pcie-slot {
            position: relative;
            background: rgba(5, 8, 15, 0.75);
            border: 1px dashed rgba(148, 163, 184, 0.22);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Вставленная в слот видеокарта */
        .pcie-slot.installed {
            border: 1px solid rgba(245, 158, 11, 0.75);
            background: #0f172a;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
            animation: cardInsert 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .pcie-slot.installed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Кабель питания PCIe 8-pin сверху карты */
        .pcie-power-cable {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 7px;
            background: #1e293b;
            border-bottom: 2px solid #f59e0b;
            border-radius: 0 0 3px 3px;
            z-index: 3;
        }
        /* Индикатор работы и вращающийся блик кулера */
        .pcie-led {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: blinkLed 0.9s infinite alternate;
            z-index: 4;
        }
        .pcie-label {
            position: absolute;
            bottom: 2px;
            left: 3px;
            right: 11px;
            font-size: 7px;
            font-weight: 800;
            color: #fff;
            background: rgba(0,0,0,0.75);
            padding: 1px 3px;
            border-radius: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 3;
        }
        @keyframes cardInsert {
            0% { transform: translateY(-28px) scale(1.08); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes blinkLed {
            from { opacity: 0.45; }
            to { opacity: 1; }
        }

        /* Датчики и кнопка продувки внизу вьюпорта */
        .rig-hud {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 10px;
            z-index: 15;
            pointer-events: none;
        }
        .sensors { flex: 1; display: flex; flex-direction: column; gap: 4px; pointer-events: auto; }
        .sensor-row { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; text-shadow: 0 1px 4px #000; }
        .s-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden; }
        .s-fill { height: 100%; transition: width 0.25s, background 0.25s; }
        .cool-btn {
            background: rgba(37, 99, 235, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(96, 165, 250, 0.55);
            color: #bfdbfe;
            font-size: 11px;
            font-weight: 800;
            padding: 8px 11px;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
        }
        .cool-btn:active { background: #2563eb; color: #fff; }

        /* Навигация */
        .tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-b {
            flex: 1;
            min-width: 74px;
            padding: 12px 4px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .tab-b.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
            background: rgba(245, 158, 11, 0.12);
        }

        /* Карточки магазина */
        .main-pane { flex: 1; padding: 12px; padding-bottom: 40px; }
        .pane-content { display: none; flex-direction: column; gap: 9px; }
        .pane-content.active { display: flex; }

        .item-card {
            display: flex;
            align-items: center;
            gap: 11px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;

        .item-photo {
            width: 58px;
            height: 58px;
            border-radius: 9px;
            background: #090d16;
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
            flex-shrink: 0;

        .item-info { flex: 1; min-width: 0; }
        .item-title-row { display: flex; align-items: center; gap: 6px; }
        .item-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { font-size: 10px; font-weight: 800; background: rgba(245,158,11,0.16); color: var(--gold); padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(245,158,11,0.3); }
        .item-specs { font-size: 11px; color: var(--muted); margin-top: 3px; }
        .item-warn { font-size: 10px; color: var(--red); font-weight: 700; margin-top: 2px; }

        .buy-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #05070b;
            border: none;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 900;
            min-width: 86px;
            cursor: pointer;
            text-align: center;
        }
        .buy-btn.usd { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; }
        .buy-btn:disabled { background: #182032; color: #475569; cursor: not-allowed; }

        .float-num {
            position: absolute;
            font-weight: 900;
            font-size: 17px;
            color: #fbbf24;
            text-shadow: 0 2px 8px #000;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.95); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>

// Генератор фотореалистичных SVG-рендеров видеокарт (используется мгновенно, если файл .jpg еще не загружен в GitHub)
function makeGpuRender(accent, fans, label) {
    let fanSvg = '';
    if (fans === 1) {
        fanSvg = `<circle cx="50" cy="50" r="26" fill="#0b0f17" stroke="${accent}" stroke-width="2.5"/><circle cx="50" cy="50" r="8" fill="#1e293b"/><path d="M50 24 L56 44 L50 50 Z M76 50 L56 56 L50 50 Z M50 76 L44 56 L50 50 Z M24 50 L44 44 L50 50 Z" fill="#64748b"/>`;
    } else if (fans === 2) {
        fanSvg = `<circle cx="32" cy="50" r="19" fill="#0b0f17" stroke="${accent}" stroke-width="2"/><circle cx="68" cy="50" r="19" fill="#0b0f17" stroke="${accent}" stroke-width="2"/><circle cx="32" cy="50" r="6" fill="#334155"/><circle cx="68" cy="50" r="6" fill="#334155"/>`;

        fanSvg = `<circle cx="23" cy="50" r="14" fill="#0b0f17" stroke="${accent}" stroke-width="2"/><circle cx="50" cy="50" r="14" fill="#0b0f17" stroke="${accent}" stroke-width="2"/><circle cx="77" cy="50" r="14" fill="#0b0f17" stroke="${accent}" stroke-width="2"/>`;
    } else {
        fanSvg = `<rect x="14" y="24" width="72" height="52" rx="4" fill="#0f172a" stroke="${accent}" stroke-width="2"/><line x1="22" y1="34" x2="78" y2="34" stroke="#475569" stroke-width="3"/><line x1="22" y1="45" x2="78" y2="45" stroke="#475569" stroke-width="3"/><line x1="22" y1="56" x2="78" y2="56" stroke="#475569" stroke-width="3"/><line x1="22" y1="67" x2="78" y2="67" stroke="#475569" stroke-width="3"/>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#090d16"/></linearGradient></defs>
        <rect width="100" height="100" fill="#060911"/>
        <rect x="8" y="18" width="84" height="64" rx="8" fill="url(#g)" stroke="#334155" stroke-width="2"/>
        <rect x="14" y="14" width="40" height="4" rx="2" fill="${accent}"/>
        ${fanSvg}
        <rect x="18" y="82" width="46" height="5" fill="#d97706"/>
    </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

    activeRig: 'r1', ownedRigs: { r1: 1 }, owned: {}, rate: 0.50
};

function save() { localStorage.setItem('cryptoRealRigV4', JSON.stringify(state)); }

function fmt(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
    return n.toFixed(2);
}

function getPrice(item) {
    const cnt = state.owned[item.id] || 0;
    return Math.floor(item.cost * Math.pow(1.22, cnt));
}

function getTotalSlots() {
    const active = RIGS_CATALOG.find(r => r.id === state.activeRig);
    return active ? active.slots : 6;
}

function getTotalCardsCount() {
    return GPU_CATALOG.reduce((sum, g) => sum + (state.owned[g.id] || 0), 0);
}

function getUsedWatts() {
    return GPU_CATALOG.reduce((s, g) => s + g.watts * (state.owned[g.id] || 0), 0);
}

function getRawPPS() {
    return GPU_CATALOG.reduce((s, g) => s + g.pps * (state.owned[g.id] || 0), 0);
}

function getActualPPS() {
    const raw = getRawPPS();
    return state.temp >= 90 ? raw * 0.5 : raw;
}

document.querySelectorAll('.tab-b').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('.tab-b').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.pane-content').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('pane-' + b.dataset.t).classList.add('active');
    });
});

const viewport = document.getElementById('rigViewport');
viewport.addEventListener('click', (e) => {
    state.mgc += state.clickPower;
    state.temp = Math.min(105, state.temp + 0.25);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    const rect = viewport.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'float-num';
    pop.textContent = '+' + fmt(state.clickPower);
    pop.style.left = (e.clientX - rect.left - 18) + 'px';
    pop.style.top = (e.clientY - rect.top - 12) + 'px';
    viewport.appendChild(pop);
    setTimeout(() => pop.remove(), 600);

    updateUI();
});

document.getElementById('coolBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.temp = Math.max(32, state.temp - 15);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    updateUI();
});

window.buyItem = function(type, id) {
    if (type === 'rig') {
        const rig = RIGS_CATALOG.find(r => r.id === id);
        if (state.ownedRigs[id]) {
            state.activeRig = id;
            save(); renderAll(); updateUI(); return;
        }
        if (rig.curr === 'mgc' && state.mgc >= rig.cost) {
            state.mgc -= rig.cost; state.ownedRigs[id] = 1; state.activeRig = id;
        } else if (rig.curr === 'usd' && state.usd >= rig.cost) {
            state.usd -= rig.cost; state.ownedRigs[id] = 1; state.activeRig = id;
        } else return;
    } else {
        const list = type === 'gpu' ? GPU_CATALOG : (type === 'oc' ? OC_CATALOG : INFRA_CATALOG);
        const item = list.find(x => x.id === id);
        const price = getPrice(item);

        if (item.curr === 'mgc' && state.mgc < price) return;
        if (item.curr === 'usd' && state.usd < price) return;

        if (type === 'gpu') {
            if (getTotalCardsCount() >= getTotalSlots()) {
                alert('Все слоты в корпусе заняты! Купите более вместительный корпус во вкладке «Корпуса».');
                return;
            }
            if (getUsedWatts() + item.watts > state.maxWatts) {
                alert('Не хватает мощности БП! Улучшите питание во вкладке «Питание».');
                return;
            }
        }

        if (item.curr === 'mgc') state.mgc -= price;
        else state.usd -= price;

        state.owned[id] = (state.owned[id] || 0) + 1;

        if (type === 'oc') state.clickPower += item.ppc;
        if (type === 'infra') {
            if (item.type === 'watt') state.maxWatts += item.val;
            if (item.type === 'cool') state.cooling += item.val;
        }
    }

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save(); renderAll(); updateUI();
};

window.sellCrypto = function(ratio) {
    const amount = state.mgc * ratio;
    if (amount <= 0.01) return;
    state.mgc -= amount;
    state.usd += amount * state.rate;
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save(); updateUI();
};

// Отрисовка установленных видеокарт прямо в PCIe-слотах корпуса
function renderChassisSlots() {
    const grid = document.getElementById('pcieSlotsGrid');
    const maxSlots = getTotalSlots();
    const cols = maxSlots <= 6 ? 6 : (maxSlots <= 12 ? 6 : 9);
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    let installedList = [];
    GPU_CATALOG.forEach(g => {
        const cnt = state.owned[g.id] || 0;
        for (let i = 0; i < cnt; i++) installedList.push(g);
    });

    let html = '';
    for (let i = 0; i < maxSlots; i++) {
        const card = installedList[i];
        if (card) {
            html += `<div class="pcie-slot installed">
                <div class="pcie-power-cable"></div>
                <img src="${card.photo}" onerror="this.onerror=null;this.src='${card.fallback}'">
                <div class="pcie-label">${card.name.split(' ')[0]} ${card.name.split(' ')[1] || ''}</div>
                <div class="pcie-led"></div>
            </div>`;
        } else {
            html += `<div class="pcie-slot"><span style="font-size:8px;color:#334155;font-weight:700">PCIe</span></div>`;
        }
    }
    grid.innerHTML = html;
}

function renderAll() {
    renderChassisSlots();

    document.getElementById('pane-gpus').innerHTML = GPU_CATALOG.map(g => {
        const cnt = state.owned[g.id] || 0;
        const p = getPrice(g);
        const canAfford = g.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        const noSlots = getTotalCardsCount() >= getTotalSlots();
        const noWatt = getUsedWatts() + g.watts > state.maxWatts;
        return `<div class="item-card">
            <img class="item-photo" src="${g.photo}" onerror="this.onerror=null;this.src='${g.fallback}'">
            <div class="item-info">
                <div class="item-title-row">
                    <div class="item-name">${g.name}</div>
                    <span class="badge">x${cnt}</span>
                </div>
                <div class="item-specs">+${fmt(g.pps)} MGC/с • ${g.watts}W</div>
                ${noSlots ? '<div class="item-warn">Нет свободных слотов в корпусе!</div>' : (noWatt ? '<div class="item-warn">Не хватает мощности БП!</div>' : '')}
            </div>
            <button class="buy-btn ${g.curr === 'usd' ? 'usd' : ''}" ${!canAfford || noSlots || noWatt ? 'disabled' : ''} onclick="buyItem('gpu','${g.id}')">
                ${g.curr === 'usd' ? '$' : ''}${fmt(p)} ${g.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-rigs').innerHTML = RIGS_CATALOG.map(r => {
        const owned = !!state.ownedRigs[r.id];
        const active = state.activeRig === r.id;
        return `<div class="item-card">
            <img class="item-photo" src="${r.photo}" onerror="this.onerror=null;this.src='${r.fallback}'">
            <div class="item-info">
                <div class="item-title-row">
                    <div class="item-name">${r.name}</div>
                </div>
                <div class="item-specs">Слотов для видеокарт: ${r.slots} шт.</div>
            </div>
            <button class="buy-btn ${r.curr === 'usd' ? 'usd' : ''}" ${active ? 'disabled' : ''} onclick="buyItem('rig','${r.id}')">
                ${active ? 'Активен' : (owned ? 'Выбрать' : (r.curr === 'usd' ? '$' : '') + fmt(r.cost) + (r.curr === 'mgc' ? ' MGC' : ''))}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-oc').innerHTML = OC_CATALOG.map(o => {
        const cnt = state.owned[o.id] || 0;
        const p = getPrice(o);
        const can = o.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="item-card">
            <div class="item-info">
                <div class="item-title-row">
                    <div class="item-name">${o.name}</div>
                    <span class="badge">Ур.${cnt}</span>
                </div>
                <div class="item-specs">${o.desc}</div>
            </div>
            <button class="buy-btn ${o.curr === 'usd' ? 'usd' : ''}" ${!can ? 'disabled' : ''} onclick="buyItem('oc','${o.id}')">
                ${o.curr === 'usd' ? '$' : ''}${fmt(p)} ${o.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-infra').innerHTML = INFRA_CATALOG.map(i => {
        const cnt = state.owned[i.id] || 0;
        const p = getPrice(i);
        const can = i.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="item-card">
            <div class="item-info">
                <div class="item-title-row">
                    <div class="item-name">${i.name}</div>
                    <span class="badge">x${cnt}</span>
                </div>
                <div class="item-specs">${i.desc}</div>
            </div>
            <button class="buy-btn ${i.curr === 'usd' ? 'usd' : ''}" ${!can ? 'disabled' : ''} onclick="buyItem('infra','${i.id}')">
                ${i.curr === 'usd' ? '$' : ''}${fmt(p)} ${i.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');
}

function updateUI() {
    const pps = getActualPPS();
    const usedW = getUsedWatts();
    const wPct = Math.min(100, (usedW / state.maxWatts) * 100);

    document.getElementById('mgcVal').textContent = fmt(state.mgc);
    document.getElementById('usdVal').textContent = '$' + fmt(state.usd);
    document.getElementById('hashVal').textContent = fmt(pps * 15.2) + ' MH/s';
    document.getElementById('rateBox').textContent = '$' + state.rate.toFixed(3);

    document.getElementById('wText').textContent = `${fmt(usedW)}/${fmt(state.maxWatts)}W`;
    const wFill = document.getElementById('wFill');
    wFill.style.width = wPct + '%';
    wFill.style.background = wPct > 85 ? '#ef4444' : '#10b981';

    document.getElementById('tText').textContent = Math.round(state.temp) + '°C';
    const tFill = document.getElementById('tFill');
    tFill.style.width = Math.min(100, state.temp) + '%';
    tFill.style.background = state.temp >= 90 ? '#ef4444' : (state.temp >= 70 ? '#f59e0b' : '#3b82f6');
}

setInterval(() => {
    const pps = getActualPPS();
    const heatSum = GPU_CATALOG.reduce((s, g) => s + g.heat * (state.owned[g.id] || 0), 0);
    if (pps > 0) {
        state.mgc += pps;
        state.temp = Math.min(105, Math.max(32, state.temp + heatSum * 0.16 - state.cooling * 0.35));
    } else {
        state.temp = Math.max(32, state.temp - 0.5);
    }

    state.rate = Math.max(0.2, Math.min(2.5, state.rate + (Math.random() - 0.49) * 0.03));

    save(); updateUI();
}, 1000);

renderAll();
updateUI();
</script>
</body>
</html>
