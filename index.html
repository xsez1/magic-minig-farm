<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Mining Farm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #181c24;
            --accent: #ff9100;
            --accent-glow: rgba(255, 145, 0, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border: #262c36;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 70px;
        }

        /* Статистика баланса */
        .stats-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 20px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .balance {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .income {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Интерактивная зона: Стол и Компьютер */
        .desk-area {
            width: 100%;
            height: 220px;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border: 2px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.5);
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .desk-area:active {
            transform: scale(0.98);
        }

        /* Монитор и корпус */
        .pc-setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .monitor {
            width: 130px;
            height: 85px;
            background: #090d12;
            border: 3px solid #30363d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 145, 0, 0.15);
        }
        .monitor-screen {
            font-size: 26px;
        }
        .monitor-led {
            width: 6px;
            height: 6px;
            background-color: #00ff66;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
            right: 8px;
            box-shadow: 0 0 6px #00ff66;
        }
        .stand {
            width: 30px;
            height: 15px;
            background: #21262d;
        }
        .desk-table {
            width: 90%;
            height: 12px;
            background: #30363d;
            border-radius: 6px;
            border-top: 2px solid #484f58;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* Контент вкладок */
        .tab-content {
            display: none;
            width: 100%;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Карточки апгрейдов и комплектующих */
        .shop-item {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        .shop-item:hover {
            border-color: var(--accent);
        }
        .item-details h4 {
            margin: 0 0 3px 0;
            font-size: 15px;
            color: var(--text-main);
        }
        .item-details p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }

        /* Эффект клика (цифры вверх) */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
        .floating-text {
            position: absolute;
            color: var(--accent);
            font-weight: 900;
            font-size: 20px;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            animation: floatUp 0.6s ease-out forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок баланса -->
        <div class="stats-card">
            <div class="balance" id="balance">0 COIN</div>
            <div class="income">Пассив: <span id="pps">0</span>/сек | Клик: +<span id="ppc">1</span></div>
        </div>

        <!-- Стол и компьютер (Кликабельная зона) -->
        <div class="desk-area" id="mineBtn">
            <div class="pc-setup">
                <div class="monitor">
                    <div class="monitor-screen" id="pcIcon">💻</div>
                    <div class="monitor-led"></div>
                </div>
                <div class="stand"></div>
                <div class="desk-table"></div>
            </div>
        </div>

        <!-- Навигация по вкладкам -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('farm')">🖥 Ферма</button>
            <button class="tab-btn" onclick="switchTab('overclock')">⚡ Разгон</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">🛠 Железо</button>
        </div>

        <!-- Вкладка 1: Майнинг Ферма (Автодоход) -->
        <div id="tab-farm" class="tab-content active">
            <div id="farm-shop"></div>
        </div>

        <!-- Вкладка 2: Разгон (Усиление клика) -->
        <div id="tab-overclock" class="tab-content">
            <div id="click-shop"></div>
        </div>

        <!-- Вкладка 3: Железо (Визуальные апгрейды ПК и стола) -->
        <div id="tab-upgrades" class="tab-content">
            <div id="visual-shop"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let state = JSON.parse(localStorage.getItem('magicFarmSave')) || {
            balance: 0,
            clickPower: 1,
            level: 0,
            farmItems: [
                { id: 0, name: "USB-флешка майнер", desc: "+1 монета/сек", baseCost: 15, pps: 1, count: 0 },
                { id: 1, name: "Старый офисник", desc: "+6 монет/сек", baseCost: 120, pps: 6, count: 0 },
                { id: 2, name: "GTX 1060 6GB", desc: "+30 монет/сек", baseCost: 650, pps: 30, count: 0 },
                { id: 3, name: "Ферма на 6 карт", desc: "+150 монет/сек", baseCost: 3200, pps: 150, count: 0 },
                { id: 4, name: "ASIC Antminer S19", desc: "+750 монет/сек", baseCost: 15000, pps: 750, count: 0 },
                { id: 5, name: "Квантовый сервер", desc: "+3800 монет/сек", baseCost: 80000, pps: 3800, count: 0 }
            ],
            clickItems: [
                { id: 10, name: "Обычная мышка", desc: "+1 к силе клика", baseCost: 25, ppc: 1, count: 0 },
                { id: 11, name: "Геймерская мышь", desc: "+5 к силе клика", baseCost: 200, ppc: 5, count: 0 },
                { id: 12, name: "Механическая клавиатура", desc: "+25 к силе клика", baseCost: 1100, ppc: 25, count: 0 },
                { id: 13, name: "Макросный скрипт", desc: "+120 к силе клика", baseCost: 6000, ppc: 120, count: 0 },
                { id: 14, name: "Квантовый кликер", desc: "+600 к силе клика", baseCost: 30000, ppc: 600, count: 0 }
            ],
            visualItems: [
                { id: 20, name: "Лампа с RGB", desc: "Улучшает стиль комнаты", baseCost: 100, icon: "💡", count: 0 },
                { id: 21, name: "Игровой монитор 144Hz", desc: "Красивый изогнутый экран", baseCost: 500, icon: "🖥️", count: 0 },
                { id: 22, name: "Мощный ПК в сборе", desc: "Топовый корпус с подсветкой", baseCost: 2500, icon: "⚡", count: 0 },
                { id: 23, name: "Киберспортивный стол", desc: "Профессиональный сетап", baseCost: 12000, icon: "💺", count: 0 }
            ]
        };

        const balanceEl = document.getElementById('balance');
        const ppsEl = document.getElementById('pps');
        const ppcEl = document.getElementById('ppc');
        const mineBtn = document.getElementById('mineBtn');
        const pcIcon = document.getElementById('pcIcon');

        function getCost(item) {
            return Math.floor(item.baseCost * Math.pow(1.15, item.count));
        }

        function getTotalPPS() {
            return state.farmItems.reduce((sum, item) => sum + (item.pps * item.count), 0);
        }

        function saveGame() {
            localStorage.setItem('magicFarmSave', JSON.stringify(state));
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function updateUI() {
            balanceEl.innerText = Math.floor(state.balance) + " COIN";
            ppsEl.innerText = getTotalPPS();
            ppcEl.innerText = state.clickPower;

            // Обновляем иконку ПК в зависимости от купленных визуальных апгрейдов
            if (state.visualItems[2].count > 0) pcIcon.innerText = "⚡";
            else if (state.visualItems[1].count > 0) pcIcon.innerText = "🖥️";
            else if (state.visualItems[0].count > 0) pcIcon.innerText = "💡";
            else pcIcon.innerText = "💻";

            // Рендер вкладки Ферма
            let farmHtml = '';
            state.farmItems.forEach(item => {
                const cost = getCost(item);
                farmHtml += `
                    <div class="shop-item">
                        <div class="item-details">
                            <h4>${item.name} (ур. ${item.count})</h4>
                            <p>${item.desc}</p>
                        </div>
                        <button class="action-btn" ${state.balance < cost ? 'disabled' : ''} onclick="buyItem(0, ${item.id})">
                            ${cost} 🪙
                        </button>
                    </div>`;
            });
            document.getElementById('farm-shop').innerHTML = farmHtml;

            // Рендер вкладки Разгон
            let clickHtml = '';
            state.clickItems.forEach(item => {
                const cost = getCost(item);
                clickHtml += `
                    <div class="shop-item">
                        <div class="item-details">
                            <h4>${item.name} (ур. ${item.count})</h4>
                            <p>${item.desc}</p>
                        </div>
                        <button class="action-btn" ${state.balance < cost ? 'disabled' : ''} onclick="buyItem(1, ${item.id})">
                            ${cost} 🪙
                        </button>
                    </div>`;
            });
            document.getElementById('click-shop').innerHTML = clickHtml;

            // Рендер вкладки Железо
            let visualHtml = '';
            state.visualItems.forEach(item => {
                const cost = getCost(item);
                visualHtml += `
                    <div class="shop-item">
                        <div class="item-details">
                            <h4>${item.icon} ${item.name} (${item.count})</h4>
                            <p>${item.desc}</p>
                        </div>
                        <button class="action-btn" ${state.balance < cost || item.count > 0 ? 'disabled' : ''} onclick="buyItem(2, ${item.id})">
                            ${item.count > 0 ? 'Куплено' : cost + ' 🪙'}
                        </button>
                    </div>`;
            });
            document.getElementById('visual-shop').innerHTML = visualHtml;
        }

        window.buyItem = function(category, id) {
            let list = category === 0 ? state.farmItems : (category === 1 ? state.clickItems : state.visualItems);
            const item = list.find(u => u.id === id);
            const cost = getCost(item);

            if (state.balance >= cost) {
                state.balance -= cost;
                item.count++;

                if (category === 1) {
                    state.clickPower += item.ppc;
                }

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                saveGame();
                updateUI();
            }
        }

        // Клик по столу с компьютером
        mineBtn.addEventListener('click', (e) => {
            state.balance += state.clickPower;

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            // Создаем анимированную цифру клика
            const rect = mineBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.innerText = "+" + state.clickPower;
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';
            mineBtn.appendChild(floatEl);

            setTimeout(() => floatEl.remove(), 600);

            saveGame();
            updateUI();
        });

        // Пассивный доход каждую секунду
        setInterval(() => {
            const pps = getTotalPPS();
            if (pps > 0) {
                state.balance += pps;
                saveGame();
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
