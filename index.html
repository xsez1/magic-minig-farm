<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Rig Management v2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #161922;
            --surface-card: #1c212e;
            --border: #283044;
            --text-main: #f0f3f6;
            --text-muted: #8b95a5;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            overflow-x: hidden;
        }
        .app {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }
        .terminal-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .metric-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .metric-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .metric-value {
            font-size: 13px;
            font-weight: 700;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rig-monitor {
            position: relative;
            width: 100%;
            height: 250px;
            background: #0b0d12;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
        }
        .rig-photo-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
        }
        .rig-workspace {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 170px;
            background: rgba(15, 18, 26, 0.85);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .rack-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }
        .hardware-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            align-content: center;
            margin: 6px 0;
        }
        .hw-slot {
            aspect-ratio: 1;
            background: #11141d;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .hw-slot.active { border-color: var(--accent); }
        .hw-slot img { width: 100%; height: 100%; object-fit: cover; }
        .hw-empty {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; color: #3a4456; font-weight: 600;
        }
        .rig-telemetry {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .telemetry-bars { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .t-row { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; color: var(--text-muted); }
        .t-track { flex: 1; height: 4px; background: #222736; border-radius: 2px; overflow: hidden; }
        .t-fill { height: 100%; transition: width 0.3s; }
        .action-btn-clean {
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 11px; font-weight: 600;
            padding: 7px 12px; border-radius: 6px; cursor: pointer;
        }
        .nav-tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
        .tab-item {
            flex: 1; padding: 12px 4px; background: none; border: none;
            border-bottom: 2px solid transparent; color: var(--text-muted);
            font-size: 11px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .tab-item.active { color: var(--text-main); border-bottom-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .content-container { flex: 1; padding: 12px; padding-bottom: 40px; }
        .tab-pane { display: none; flex-direction: column; gap: 8px; }
        .tab-pane.active { display: flex; }
        .catalog-card {
            display: flex; align-items: center; gap: 12px;
            background: var(--surface-card); border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 12px;
        }
        .card-thumb {
            width: 52px; height: 52px; border-radius: 6px;
            background: #0f1115; border: 1px solid var(--border);
            object-fit: cover; flex-shrink: 0;
        }
        .card-info { flex: 1; min-width: 0; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-specs { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .card-alert { font-size: 10px; color: #ef4444; font-weight: 600; margin-top: 2px; }
        .purchase-btn {
            background: var(--accent); color: #fff; border: none;
            border-radius: 6px; padding: 8px 12px; font-size: 11px; font-weight: 600;
            min-width: 80px; cursor: pointer; text-align: center;
        }
        .purchase-btn.usd { background: var(--success); }
        .purchase-btn:disabled { background: #222736; color: #4e5b73; cursor: not-allowed; }
        .float-indicator {
            position: absolute; font-weight: 700; font-size: 15px; color: var(--success);
            pointer-events: none; animation: floatUpClean 0.6s ease-out forwards; z-index: 100;
        }
        @keyframes floatUpClean {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="terminal-header">
        <div class="metric-card">
            <div class="metric-label">Баланс MGC</div>
            <div class="metric-value" id="mgcVal" style="color:var(--warning)">0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Капитал USD</div>
            <div class="metric-value" id="usdVal" style="color:var(--success)">$0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Хешрейт</div>
            <div class="metric-value" id="hashVal" style="color:var(--accent)">0 MH/s</div>
        </div>
    </div>

    <div class="rig-monitor" id="rigMonitor">
        <img class="rig-photo-bg" src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=800&q=80" alt="">
        <div class="rig-workspace">
            <div class="rack-title">
                <span>Стойка оборудования</span>
                <span id="rackSlotsCount">0 / 6</span>
            </div>
            <div class="hardware-grid" id="hardwareGrid"></div>
            <div style="font-size:9px;color:var(--text-muted);text-align:right">Клик для майнинга</div>
        </div>
        <div class="rig-telemetry">
            <div class="telemetry-bars">
                <div class="t-row">
                    <span style="width:48px">Питание:</span>
                    <div class="t-track"><div class="t-fill" id="wFill" style="width:0%;background:var(--success)"></div></div>
                    <span id="wText" style="width:55px;text-align:right">0/600W</span>
                </div>
                <div class="t-row">
                    <span style="width:48px">Нагрев:</span>
                    <div class="t-track"><div class="t-fill" id="tFill" style="width:35%;background:var(--accent)"></div></div>
                    <span id="tText" style="width:55px;text-align:right">35°C</span>
                </div>
            </div>
            <button class="action-btn-clean" id="coolBtn">Охлад</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-item active" data-t="gpus">Оборудование</button>
        <button class="tab-item" data-t="rigs">Стойки</button>
        <button class="tab-item" data-t="oc">Оптимизация</button>
        <button class="tab-item" data-t="infra">Питание</button>
        <button class="tab-item" data-t="market">Биржа</button>
    </div>

    <div class="content-container">
        <div class="tab-pane active" id="pane-gpus"></div>
        <div class="tab-pane" id="pane-rigs"></div>
        <div class="tab-pane" id="pane-oc"></div>
        <div class="tab-pane" id="pane-infra"></div>
        <div class="tab-pane" id="pane-market">
            <div style="background:var(--surface-card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;">
                <div class="metric-label" style="margin-bottom:4px">Курс MGC / USD</div>
                <div style="font-size:24px;font-weight:700;color:var(--success);margin-bottom:12px" id="rateBox">$0.50</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <button class="purchase-btn usd" onclick="sellCrypto(0.5)">Продать 50%</button>
                    <button class="purchase-btn usd" onclick="sellCrypto(1)">Продать всё</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

const GPU_CATALOG = [
    { id: 'g1', name: 'GTX 750 Ti 2GB', photo: 'https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=400&q=80', curr: 'mgc', cost: 20, pps: 0.35, watts: 55, heat: 0.2 },
    { id: 'g2', name: 'GTX 1050 Ti 4GB', photo: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=400&q=80', curr: 'mgc', cost: 120, pps: 1.6, watts: 75, heat: 0.35 },
    { id: 'g3', name: 'RX 470 4GB Mining', photo: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80', curr: 'mgc', cost: 590, pps: 6.8, watts: 125, heat: 0.65 },
    { id: 'g4', name: 'GTX 1060 6GB Dual', photo: 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=400&q=80', curr: 'mgc', cost: 2800, pps: 26, watts: 120, heat: 0.75 },
    { id: 'g5', name: 'RX 580 8GB Nitro+', photo: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=400&q=80', curr: 'mgc', cost: 13000, pps: 105, watts: 185, heat: 1.0 },
    { id: 'g6', name: 'GTX 1080 Ti 11GB', photo: 'https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 1100, pps: 390, watts: 250, heat: 1.4 },
    { id: 'g7', name: 'RTX 2070 Super', photo: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 5200, pps: 1550, watts: 215, heat: 1.5 },
    { id: 'g8', name: 'RTX 3060 Ti LHR', photo: 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 22000, pps: 5900, watts: 200, heat: 1.7 },
    { id: 'g9', name: 'RX 6800 XT Red Devil', photo: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 88000, pps: 20000, watts: 300, heat: 2.1 },
    { id: 'g10', name: 'RTX 3080 Ti Suprim', photo: 'https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 350000, pps: 71000, watts: 350, heat: 2.6 },
    { id: 'g11', name: 'RTX 3090 24GB NVLink', photo: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 1300000, pps: 240000, watts: 380, heat: 3.1 },
    { id: 'g12', name: 'RTX 4080 Super Noctua', photo: 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 5000000, pps: 840000, watts: 320, heat: 2.9 },
    { id: 'g13', name: 'RTX 4090 Liquid Matrix', photo: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 19000000, pps: 3000000, watts: 450, heat: 3.7 },
    { id: 'g14', name: 'NVIDIA A100 80GB', photo: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 78000000, pps: 11000000, watts: 400, heat: 4.0 },
    { id: 'g15', name: 'Antminer L7 Scrypt', photo: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 310000000, pps: 40000000, watts: 3400, heat: 6.2 },
    { id: 'g16', name: 'WhatsMiner M50S++', photo: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 1200000000, pps: 148000000, watts: 3600, heat: 7.0 },
    { id: 'g17', name: 'Antminer S21 Hydro', photo: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 5000000000, pps: 560000000, watts: 5200, heat: 8.2 },
    { id: 'g18', name: 'NVIDIA H200 AI Cluster', photo: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=400&q=80', curr: 'usd', cost: 23000000000, pps: 2300000000, watts: 8500, heat: 11.5 }
];

const RIGS_CATALOG = [
    { id: 'r1', name: 'Каркас (6 слотов)', slots: 6, cost: 0 },
    { id: 'r2', name: 'Стойка Pro (12 слотов)', slots: 12, cost: 4500, curr: 'mgc' },
    { id: 'r3', name: 'Шкаф 24U (18 слотов)', slots: 18, cost: 32000, curr: 'usd' },
    { id: 'r4', name: 'Дата-центр (24 слота)', slots: 24, cost: 250000, curr: 'usd' }
];

const OC_CATALOG = [
    { id: 'o1', name: 'Термопаста MX-4', desc: '+0.5 к клику', cost: 25, ppc: 0.5, curr: 'mgc' },
    { id: 'o2', name: 'Прошивка BIOS', desc: '+2.5 к клику', cost: 180, ppc: 2.5, curr: 'mgc' },
    { id: 'o3', name: 'Андервольтинг', desc: '+12 к клику', cost: 1200, ppc: 12, curr: 'mgc' },
    { id: 'o4', name: 'Жидкий металл', desc: '+55 к клику', cost: 750, ppc: 55, curr: 'usd' },
    { id: 'o5', name: 'HiveOS PRO', desc: '+300 к клику', cost: 4200, ppc: 300, curr: 'usd' }
];

const INFRA_CATALOG = [
    { id: 'i1', name: 'БП 750W', desc: '+750W мощности', val: 750, cost: 80, curr: 'mgc', type: 'watt' },
    { id: 'i2', name: 'Серверный БП 1600W', desc: '+1600W мощности', val: 1600, cost: 320, curr: 'usd', type: 'watt' },
    { id: 'i3', name: 'Кулеры Delta', desc: 'Отвод тепла +3', val: 3, cost: 150, curr: 'mgc', type: 'cool' },
    { id: 'i4', name: 'Иммерсионная система', desc: 'Отвод тепла +20', val: 20, cost: 12000, curr: 'usd', type: 'cool' }
];

let state = JSON.parse(localStorage.getItem('enterpriseRigV3')) || {
    mgc: 0, usd: 0, clickPower: 1, maxWatts: 600, cooling: 1.5, temp: 35,
    activeRig: 'r1', ownedRigs: { r1: 1 }, owned: {}, rate: 0.50
};

function save() { localStorage.setItem('enterpriseRigV3', JSON.stringify(state)); }

function fmt(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
    return n.toFixed(2);
}

function getPrice(item) {
    const cnt = state.owned[item.id] || 0;
    return Math.floor(item.cost * Math.pow(1.22, cnt));
}

function getTotalSlots() {
    const active = RIGS_CATALOG.find(r => r.id === state.activeRig);
    return active ? active.slots : 6;
}

function getTotalCardsCount() {
    return GPU_CATALOG.reduce((sum, g) => sum + (state.owned[g.id] || 0), 0);
}

function getUsedWatts() {
    return GPU_CATALOG.reduce((s, g) => s + g.watts * (state.owned[g.id] || 0), 0);
}

function getRawPPS() {
    return GPU_CATALOG.reduce((s, g) => s + g.pps * (state.owned[g.id] || 0), 0);
}

function getActualPPS() {
    const raw = getRawPPS();
    return state.temp >= 90 ? raw * 0.5 : raw;
}

document.querySelectorAll('.tab-item').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById('pane-' + b.dataset.t).classList.add('active');
    });
});

const monitor = document.getElementById('rigMonitor');
monitor.addEventListener('click', (e) => {
    state.mgc += state.clickPower;
    state.temp = Math.min(105, state.temp + 0.25);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    const rect = monitor.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'float-indicator';
    pop.textContent = '+' + fmt(state.clickPower);
    pop.style.left = (e.clientX - rect.left - 15) + 'px';
    pop.style.top = (e.clientY - rect.top - 10) + 'px';
    monitor.appendChild(pop);
    setTimeout(() => pop.remove(), 600);

    updateUI();
});

document.getElementById('coolBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.temp = Math.max(32, state.temp - 15);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    updateUI();
});

window.buyItem = function(type, id) {
    if (type === 'rig') {
        const rig = RIGS_CATALOG.find(r => r.id === id);
        if (state.ownedRigs[id]) {
            state.activeRig = id;
            save(); renderAll(); updateUI(); return;
        }
        if (rig.curr === 'mgc' && state.mgc >= rig.cost) {
            state.mgc -= rig.cost; state.ownedRigs[id] = 1; state.activeRig = id;
        } else if (rig.curr === 'usd' && state.usd >= rig.cost) {
            state.usd -= rig.cost; state.ownedRigs[id] = 1; state.activeRig = id;
        } else return;
    } else {
        const list = type === 'gpu' ? GPU_CATALOG : (type === 'oc' ? OC_CATALOG : INFRA_CATALOG);
        const item = list.find(x => x.id === id);
        const price = getPrice(item);

        if (item.curr === 'mgc' && state.mgc < price) return;
        if (item.curr === 'usd' && state.usd < price) return;

        if (type === 'gpu') {
            if (getTotalCardsCount() >= getTotalSlots()) {
                alert('Лимит слотов стойки исчерпан.');
                return;
            }
            if (getUsedWatts() + item.watts > state.maxWatts) {
                alert('Превышен лимит мощности БП.');
                return;
            }
        }

        if (item.curr === 'mgc') state.mgc -= price;
        else state.usd -= price;

        state.owned[id] = (state.owned[id] || 0) + 1;

        if (type === 'oc') state.clickPower += item.ppc;
        if (type === 'infra') {
            if (item.type === 'watt') state.maxWatts += item.val;
            if (item.type === 'cool') state.cooling += item.val;
        }
    }

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save(); renderAll(); updateUI();
};

window.sellCrypto = function(ratio) {
    const amount = state.mgc * ratio;
    if (amount <= 0.01) return;
    state.mgc -= amount;
    state.usd += amount * state.rate;
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save(); updateUI();
};

function renderHardwareRack() {
    const grid = document.getElementById('hardwareGrid');
    const maxSlots = getTotalSlots();
    document.getElementById('rackSlotsCount').textContent = `${getTotalCardsCount()} / ${maxSlots}`;

    let installedCards = [];
    GPU_CATALOG.forEach(g => {
        const count = state.owned[g.id] || 0;
        for (let i = 0; i < count; i++) {
            installedCards.push(g);
        }
    });

    let html = '';
    for (let i = 0; i < maxSlots; i++) {
        const card = installedCards[i];
        if (card) {
            html += `<div class="hw-slot active"><img src="${card.photo}" alt=""></div>`;
        } else {
            html += `<div class="hw-slot"><div class="hw-empty">PCIe</div></div>`;
        }
    }
    grid.innerHTML = html;
}

function renderAll() {
    renderHardwareRack();

    document.getElementById('pane-gpus').innerHTML = GPU_CATALOG.map(g => {
        const cnt = state.owned[g.id] || 0;
        const p = getPrice(g);
        const canAfford = g.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        const noSlots = getTotalCardsCount() >= getTotalSlots();
        const noWatt = getUsedWatts() + g.watts > state.maxWatts;
        return `<div class="catalog-card">
            <img class="card-thumb" src="${g.photo}" alt="">
            <div class="card-info">
                <div class="card-title">${g.name} <span style="font-size:10px;color:var(--text-muted)">[x${cnt}]</span></div>
                <div class="card-specs">+${fmt(g.pps)} MGC/с • ${g.watts}W</div>
                ${noSlots ? '<div class="card-alert">Нет слотов</div>' : (noWatt ? '<div class="card-alert">Мало питания</div>' : '')}
            </div>
            <button class="purchase-btn ${g.curr === 'usd' ? 'usd' : ''}" ${!canAfford || noSlots || noWatt ? 'disabled' : ''} onclick="buyItem('gpu','${g.id}')">
                ${g.curr === 'usd' ? '$' : ''}${fmt(p)} ${g.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-rigs').innerHTML = RIGS_CATALOG.map(r => {
        const owned = !!state.ownedRigs[r.id];
        const active = state.activeRig === r.id;
        return `<div class="catalog-card">
            <div class="card-info">
                <div class="card-title">${r.name}</div>
                <div class="card-specs">Слотов: ${r.slots}</div>
            </div>
            <button class="purchase-btn ${r.curr === 'usd' ? 'usd' : ''}" ${active ? 'disabled' : ''} onclick="buyItem('rig','${r.id}')">
                ${active ? 'Активен' : (owned ? 'Выбрать' : (r.curr === 'usd' ? '$' : '') + fmt(r.cost))}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-oc').innerHTML = OC_CATALOG.map(o => {
        const cnt = state.owned[o.id] || 0;
        const p = getPrice(o);
        const can = o.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="catalog-card">
            <div class="card-info">
                <div class="card-title">${o.name} <span style="font-size:10px;color:var(--text-muted)">[Ур.${cnt}]</span></div>
                <div class="card-specs">${o.desc}</div>
            </div>
            <button class="purchase-btn ${o.curr === 'usd' ? 'usd' : ''}" ${!can ? 'disabled' : ''} onclick="buyItem('oc','${o.id}')">
                ${o.curr === 'usd' ? '$' : ''}${fmt(p)} ${o.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');

    document.getElementById('pane-infra').innerHTML = INFRA_CATALOG.map(i => {
        const cnt = state.owned[i.id] || 0;
        const p = getPrice(i);
        const can = i.curr === 'mgc' ? state.mgc >= p : state.usd >= p;
        return `<div class="catalog-card">
            <div class="card-info">
                <div class="card-title">${i.name} <span style="font-size:10px;color:var(--text-muted)">[x${cnt}]</span></div>
                <div class="card-specs">${i.desc}</div>
            </div>
            <button class="purchase-btn" ${!can ? 'disabled' : ''} onclick="buyItem('infra','${i.id}')">
                ${i.curr === 'usd' ? '$' : ''}${fmt(p)} ${i.curr === 'mgc' ? 'MGC' : ''}
            </button>
        </div>`;
    }).join('');
}

function updateUI() {
    const pps = getActualPPS();
    const usedW = getUsedWatts();
    const wPct = Math.min(100, (usedW / state.maxWatts) * 100);

    document.getElementById('mgcVal').textContent = fmt(state.mgc);
    document.getElementById('usdVal').textContent = '$' + fmt(state.usd);
    document.getElementById('hashVal').textContent = fmt(pps * 14.8) + ' MH/s';
    document.getElementById('rateBox').textContent = '$' + state.rate.toFixed(3);

    document.getElementById('wText').textContent = `${fmt(usedW)}/${fmt(state.maxWatts)}W`;
    const wFill = document.getElementById('wFill');
    wFill.style.width = wPct + '%';
    wFill.style.background = wPct > 85 ? '#ef4444' : 'var(--success)';

    document.getElementById('tText').textContent = Math.round(state.temp) + '°C';
    const tFill = document.getElementById('tFill');
    tFill.style.width = Math.min(100, state.temp) + '%';
    tFill.style.background = state.temp >= 90 ? '#ef4444' : (state.temp >= 70 ? 'var(--warning)' : 'var(--accent)');
}

setInterval(() => {
    const pps = getActualPPS();
    const heatSum = GPU_CATALOG.reduce((s, g) => s + g.heat * (state.owned[g.id] || 0), 0);
    if (pps > 0) {
        state.mgc += pps;
        state.temp = Math.min(105, Math.max(32, state.temp + heatSum * 0.15 - state.cooling * 0.3));
    } else {
        state.temp = Math.max(32, state.temp - 0.5);
    }
    state.rate = Math.max(0.2, Math.min(2.5, state.rate + (Math.random() - 0.49) * 0.02));
    save(); updateUI();
}, 1000);

renderAll();
updateUI();
</script>
</body>
</html>
