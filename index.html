<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Hardware Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0d12;
            --surface: #141824;
            --card: #1a202c;
            --border: #2d3748;
            --text: #f7fafc;
            --muted: #a0aec0;
            --accent: #3182ce;
            --success: #38a169;
            --danger: #e53e3e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        .app { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Хэдер метрик */
        .header {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            padding: 10px; background: var(--surface); border-bottom: 1px solid var(--border);
        }
        .metric { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
        .metric-title { font-size: 9px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
        .metric-val { font-size: 13px; font-weight: 700; margin-top: 2px; }

        /* Зона рига и стойки */
        .rig-container {
            position: relative; width: 100%; height: 240px; background: #000;
            border-bottom: 1px solid var(--border); overflow: hidden;
        }
        .rig-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0.3;
        }
        .rig-overlay {
            position: absolute; inset: 10px; background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .rack-header { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
        
        .hardware-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0;
        }
        .slot {
            aspect-ratio: 1; background: #0f172a; border: 1px solid var(--border);
            border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .slot.active { border-color: var(--accent); }
        .slot img { width: 100%; height: 100%; object-fit: cover; }
        .slot-empty { font-size: 8px; color: #4a5568; font-weight: 600; }

        .telemetry { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
        .t-bar { flex: 1; height: 4px; background: #2d3748; border-radius: 2px; margin: 0 8px; overflow: hidden; }
        .t-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

        /* Навигация */
        .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
        .tab {
            flex: 1; padding: 10px; background: none; border: none; border-bottom: 2px solid transparent;
            color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
        }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); background: rgba(49, 130, 206, 0.05); }

        /* Каталог */
        .content { flex: 1; padding: 10px; overflow-y: auto; padding-bottom: 30px; }
        .pane { display: none; flex-direction: column; gap: 8px; }
        .pane.active { display: flex; }

        .item-card {
            display: flex; align-items: center; gap: 10px; background: var(--card);
            border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
        }
        .item-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid var(--border); flex-shrink: 0; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
        
        .buy-btn {
            background: var(--accent); color: white; border: none; border-radius: 6px;
            padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .buy-btn:disabled { background: #2d3748; color: #718096; cursor: not-allowed; }

        .float-num {
            position: absolute; font-weight: 800; font-size: 14px; color: var(--success);
            pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-35px); }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Хэдер -->
    <div class="header">
        <div class="metric">
            <div class="metric-title">Баланс</div>
            <div class="metric-val" id="balVal" style="color: #ecc94b;">0.00</div>
        </div>
        <div class="metric">
            <div class="metric-title">Хешрейт</div>
            <div class="metric-val" id="hashVal" style="color: var(--accent);">0 MH/s</div>
        </div>
        <div class="metric">
            <div class="metric-title">Нагрев</div>
            <div class="metric-val" id="tempVal" style="color: var(--success);">35°C</div>
        </div>
    </div>

    <!-- Монитор фермы с реальной стойкой -->
    <div class="rig-container" id="clickArea">
        <img class="rig-bg" src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=800&q=80" alt="Rig Chassis">
        <div class="rig-overlay">
            <div class="rack-header">
                <span>Корпус: 6x PCIe Слотов</span>
                <span id="slotsCount">0 / 6</span>
            </div>
            <div class="hardware-grid" id="hardwareGrid"></div>
            <div class="telemetry">
                <span>Питание:</span>
                <div class="t-bar"><div class="t-fill" id="powerFill"></div></div>
                <span id="powerText">0 / 500W</span>
            </div>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab active" data-tab="gpus">Видеокарты</button>
        <button class="tab" data-tab="upgrades">Апгрейд</button>
    </div>

    <!-- Контент -->
    <div class="content">
        <div class="pane active" id="pane-gpus"></div>
        <div class="pane" id="pane-upgrades"></div>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

// Чистый каталог видеокарты с реальными фотографиями оборудования (GPU, а не процессоры)
const GPUS = [
    { id: 'g1', name: 'GTX 750 Ti 2GB', photo: 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=300&q=80', cost: 15, pps: 0.2, watts: 50 },
    { id: 'g2', name: 'GTX 1060 6GB', photo: 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=300&q=80', cost: 100, pps: 1.2, watts: 120 },
    { id: 'g3', name: 'RTX 3060 Ti', photo: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80', cost: 650, pps: 6.5, watts: 200 },
    { id: 'g4', name: 'RTX 4090 24GB', photo: 'https://images.unsplash.com/photo-1587202372634-32705e3bf49c?auto=format&fit=crop&w=300&q=80', cost: 4200, pps: 35.0, watts: 450 }
];

let state = JSON.parse(localStorage.getItem('cleanRigState')) || {
    balance: 0, clickPower: 1, maxPower: 500, temp: 35, owned: {}
};

function save() { localStorage.setItem('cleanRigState', JSON.stringify(state)); }

function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
    return n.toFixed(2);
}

// Переключение вкладок
document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('pane-' + btn.dataset.tab).classList.add('active');
    });
});

// Клик по монитору фермы (добыча вручную)
const clickArea = document.getElementById('clickArea');
clickArea.addEventListener('click', (e) => {
    state.balance += state.clickPower;
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    const rect = clickArea.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'float-num';
    pop.textContent = '+' + fmt(state.clickPower);
    pop.style.left = (e.clientX - rect.left - 10) + 'px';
    pop.style.top = (e.clientY - rect.top - 10) + 'px';
    clickArea.appendChild(pop);
    setTimeout(() => pop.remove(), 600);

    updateUI();
});

// Покупка видеокарт
window.buyGpu = function(id) {
    const gpu = GPUS.find(g => g.id === id);
    const count = Object.values(state.owned).reduce((a, b) => a + b, 0);
    const usedWatts = getTotalWatts();

    if (state.balance < gpu.cost) return;
    if (count >= 6) { alert('Нет свободных слотов в корпусе (максимум 6)'); return; }
    if (usedWatts + gpu.watts > state.maxPower) { alert('Превышен лимит мощности БП!'); return; }

    state.balance -= gpu.cost;
    state.owned[id] = (state.owned[id] || 0) + 1;

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    save();
    renderAll();
    updateUI();
};

function getTotalWatts() {
    return GPUS.reduce((sum, g) => sum + g.watts * (state.owned[g.id] || 0), 0);
}

function getTotalPPS() {
    return GPUS.reduce((sum, g) => sum + g.pps * (state.owned[g.id] || 0), 0);
}

function renderRack() {
    const grid = document.getElementById('hardwareGrid');
    let cards = [];
    GPUS.forEach(g => {
        const count = state.owned[g.id] || 0;
        for(let i=0; i<count; i++) cards.push(g);
    });

    document.getElementById('slotsCount').textContent = `${cards.length} / 6`;

    let html = '';
    for(let i=0; i<6; i++) {
        if(cards[i]) {
            html += `<div class="slot active"><img src="${cards[i].photo}" alt=""></div>`;
        } else {
            html += `<div class="slot"><span class="slot-empty">PCIe</span></div>`;
        }
    }
    grid.innerHTML = html;
}

function renderCatalog() {
    document.getElementById('pane-gpus').innerHTML = GPUS.map(g => {
        const cnt = state.owned[g.id] || 0;
        const canBuy = state.balance >= g.cost;
        return `
            <div class="item-card">
                <img class="item-thumb" src="${g.photo}" alt="">
                <div class="item-info">
                    <div class="item-name">${g.name} [x${cnt}]</div>
                    <div class="item-desc">+${g.pps} /сек • ${g.watts}W</div>
                </div>
                <button class="buy-btn" ${!canBuy ? 'disabled' : ''} onclick="buyGpu('${g.id}')">${g.cost} монет</button>
            </div>
        `;
    }).join('');
}

function renderAll() {
    renderRack();
    renderCatalog();
}

function updateUI() {
    document.getElementById('balVal').textContent = fmt(state.balance);
    document.getElementById('hashVal').textContent = fmt(getTotalPPS() * 10) + ' MH/s';
    
    const watts = getTotalWatts();
    const wPct = Math.min(100, (watts / state.maxPower) * 100);
    document.getElementById('powerText').textContent = `${watts} / ${state.maxPower}W`;
    const fill = document.getElementById('powerFill');
    fill.style.width = wPct + '%';
    fill.style.background = wPct > 85 ? 'var(--danger)' : 'var(--success)';
}

// Автомайнинг каждую секунду
setInterval(() => {
    const pps = getTotalPPS();
    if (pps > 0) {
        state.balance += pps;
        save();
        updateUI();
    }
}, 1000);

renderAll();
updateUI();
</script>
</body>
</html>
