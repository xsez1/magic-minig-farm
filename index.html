<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mining Farm Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .stats {
            text-align: center;
            margin-bottom: 20px;
        }
        .balance {
            font-size: 36px;
            font-weight: bold;
            color: #00ff88;
        }
        .income {
            font-size: 14px;
            color: #888;
        }
        .mine-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%);
            border: 4px solid #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
            color: white;
            font-size: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s;
            margin: 20px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .mine-btn:active {
            transform: scale(0.92);
        }
        .shop {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        .shop h3 {
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .item {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .item-info p {
            margin: 0;
            font-size: 12px;
            color: #aaa;
        }
        .buy-btn {
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="stats">
        <div class="balance" id="balance">0.0000 BTC</div>
        <div class="income">Пассивный доход: <span id="pps">0</span>/сек | Клик: +<span id="ppc">1</span></div>
    </div>

    <div class="mine-btn" id="mineBtn">⛏️</div>

    <div class="shop">
        <h3>🖥 Магазин оборудования</h3>
        <div id="shop-items"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Состояние игры
        let state = JSON.parse(localStorage.getItem('miningSave')) || {
            balance: 0,
            clickPower: 1,
            upgrades: [
                { id: 0, name: "Старый ноутбук", desc: "+1 монета/сек", baseCost: 15, pps: 1, count: 0 },
                { id: 1, name: "Игровой ПК (GTX 1060)", desc: "+5 монет/сек", baseCost: 100, pps: 5, count: 0 },
                { id: 2, name: "Риг на 6 видеокарт", desc: "+25 монет/сек", baseCost: 500, pps: 25, count: 0 },
                { id: 3, name: "ASIC-майнер S19", desc: "+120 монет/сек", baseCost: 2500, pps: 120, count: 0 },
                { id: 4, name: "Улучшение мышки (Клик)", desc: "+1 к силе клика", baseCost: 50, isClick: true, count: 0 }
            ]
        };

        const balanceEl = document.getElementById('balance');
        const ppsEl = document.getElementById('pps');
        const ppcEl = document.getElementById('ppc');
        const shopEl = document.getElementById('shop-items');
        const mineBtn = document.getElementById('mineBtn');

        function getCost(item) {
            return Math.floor(item.baseCost * Math.pow(1.15, item.count));
        }

        function getTotalPPS() {
            return state.upgrades.reduce((sum, item) => item.isClick ? sum : sum + (item.pps * item.count), 0);
        }

        function saveGame() {
            localStorage.setItem('miningSave', JSON.stringify(state));
        }

        function updateUI() {
            balanceEl.innerText = Math.floor(state.balance) + " COIN";
            ppsEl.innerText = getTotalPPS();
            ppcEl.innerText = state.clickPower;

            shopEl.innerHTML = '';
            state.upgrades.forEach(item => {
                const cost = getCost(item);
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.name} (ур. ${item.count})</h4>
                        <p>${item.desc}</p>
                    </div>
                    <button class="buy-btn" ${state.balance < cost ? 'disabled' : ''} onclick="buyUpgrade(${item.id})">
                        ${cost}
                    </button>
                `;
                shopEl.appendChild(div);
            });
        }

        window.buyUpgrade = function(id) {
            const item = state.upgrades.find(u => u.id === id);
            const cost = getCost(item);
            if (state.balance >= cost) {
                state.balance -= cost;
                item.count++;
                if (item.isClick) {
                    state.clickPower += 1;
                }
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                saveGame();
                updateUI();
            }
        };

        mineBtn.addEventListener('click', () => {
            state.balance += state.clickPower;
            // Вибрация при клике в Telegram
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            saveGame();
            updateUI();
        });

        // Пассивный доход раз в секунду
        setInterval(() => {
            const pps = getTotalPPS();
            if (pps > 0) {
                state.balance += pps;
                saveGame();
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
